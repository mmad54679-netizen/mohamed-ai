    compileSdk 36

    defaultConfig {
        applicationId 'com.cue.qureohelper'
        minSdk 24
        targetSdk 35
        versionCode 13
        versionName '1.8.1'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
